<div>
  <form (ngSubmit)="onSubmit()" #newResourceForm="ngForm" role="form">
    <div class="input-group">
      <input type="text" class="form-control" [(ngModel)]="listName" name="listName">
      <div class="input-group-btn">
        <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown"><span class="caret"></span></button>
        <ul id="color-dropdown-menu" class="dropdown-menu dropdown-menu-right" role="menu">
          <li *ngFor="let list of rlLists" class="input-lg"><a href="#" (click)="changeList(list)">{{list.name}}</a></li>
        </ul>
      </div>
    </div>
  </form>
</div>
