<div>
  <table width="100%">
    <tr>
      <td colspan="3" class="list list-title pr-list-title">Transformed Resource List</td>
    </tr>
    <tr *ngFor="let resource of transformList">
      <td class="badge badge-blue">{{resource.typeid}}</td>
      <td width="90%">
        <span class="pr-list">{{resource.name}}</span>
      </td>
      <td class="badge">{{resource.quantity}} units</td>
    </tr>
  </table>
</div>
