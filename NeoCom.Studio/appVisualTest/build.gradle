// - P L U G I N S
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom.visualtests"
        minSdkVersion 21 // Required because the colony drawing.
        targetSdkVersion 28
        multiDexEnabled true
        versionCode 118
        versionName "0.16.0.VT"
        project.archivesBaseName = "NeoCom.VisualTests"
        project.version = android.defaultConfig.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            signingConfig debug.signingConfig
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "appname", "VisualTests"
            resValue "string", "appversionnumber", android.defaultConfig.versionName
            resValue "string", "appversionname", "v" + android.defaultConfig.versionName
            resValue "string", "appversioncode", "\"" + android.defaultConfig.versionCode + "\""
            resValue "string", "appnameversion", "NeoCom v" + android.defaultConfig.versionName

            resValue "string", "appdatabasefilename", "neocom"
            resValue "string", "sdedatabasefilename", "sde.db"
            resValue "string", "appdatabaseversion", "\"" + android.defaultConfig.versionCode + "\""

            resValue "string", "DATASOURCE_PREFERENCE", "prefkey_dataSourceList"
        }
        debug {
            initWith release
            debuggable true
            minifyEnabled false
            useProguard false
        }
    }
    sourceSets {
        main.java {
//            srcDirs += 'src/main/java-mockedclasses'
            srcDirs += 'src/main/java-visualtest'
        }
        debug.java {
        }
        release.java {
        }
        main.res {
        }
        debug.res {
        }
        test.java {
            srcDir project(':NeoCom.DataManagement').file("src/test/java-support")
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${android.defaultConfig.project.archivesBaseName}-${android.defaultConfig.versionName}.apk"
        }
    }
    lintOptions {
        abortOnError false
        quiet true
    }
    dexOptions {
        javaMaxHeapSize "4G"
        jumboMode true
        preDexLibraries true
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
}

// - T A S K S   C O M P L E M E N T A R Y
task copySDEDatabase(type: Copy) {
    copy {
        println 'Copy :app SDEDatabase to assets'
        from project(':app').file('src/main/assets/sde.db')
        into file('src/main/assets')
    }
}

// - P R O D U C T   V E R S I O N S
ext {
    supportLibraryVersion = '28.0.0'
    jodaTimeVersion = '2.3'
    jacksonVersion = '2.9.4'
    fasterxmlJackson = '2.9.4'
    ormliteVersion = '4.48'
    retrofitVersion = '2.3.0'
    powermockVersion = '2.0.2'
}

// - A N D R O I D    S U P P O R T
dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment:1.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

// - D E B U G   S T H E T O
dependencies {
    implementation 'com.facebook.stetho:stetho:1.5.1'
    implementation 'com.facebook.stetho:stetho-okhttp3:1.5.1'
}

// - P R O J E C T    D E P E N D E N C I E S
dependencies {
    // C O R E
    implementation "org.slf4j:slf4j-android:$loggerVersion"
    implementation "joda-time:joda-time:$jodaTimeVersion"
    implementation 'org.apache.commons:commons-lang3:3.7'

    implementation 'me.relex:circleindicator:2.1.0'
    implementation 'org.dimensinfin:CoreBase.core:3.0.1'
    implementation 'org.dimensinfin:ESI.SwaggerApi:4.0.1'
    implementation 'com.jakewharton:disklrucache:2.0.2'
    implementation 'com.squareup.picasso:picasso:2.71828'

    implementation project(':AndroidMVCLibrary')
    implementation project(':NeoCom.DataManagement')
    implementation project(':appFeatures')

    // D A T A B A S E
    implementation "com.j256.ormlite:ormlite-android:$ormliteVersion"
    implementation 'org.xerial:sqlite-jdbc:3.16.1'

//    implementation 'org.mockito:mockito-core:2.23.0'
}

// - L I B R A R Y   D E P E N D E N C I E S
dependencies {
    // N E O C O M . D A T A M A N A G E M E N T
    implementation 'com.beimin:eveapi:6.0.6'
    implementation "com.fasterxml.jackson.core:jackson-annotations:$fasterxmlJackson"
    implementation "com.fasterxml.jackson.core:jackson-databind:$fasterxmlJackson"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-joda:$fasterxmlJackson"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$fasterxmlJackson"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-json-org:$fasterxmlJackson"
    implementation 'org.modelmapper:modelmapper:1.1.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    implementation 'com.annimon:stream:1.1.9'

    implementation 'org.htmlparser:htmlparser:2.1'
    implementation 'com.github.scribejava:scribejava-core:5.4.0'
    implementation 'com.annimon:stream:1.1.9'
    implementation 'org.apache.commons:commons-lang3:3.7'
}

// - T E S T I N G
dependencies {
    testImplementation 'junit:junit:4.12'
    testImplementation "org.slf4j:slf4j-android:$loggerVersion"
    testImplementation 'joda-time:joda-time:2.9.9'
    testImplementation 'org.apache.commons:commons-lang3:3.7'
    testImplementation 'com.openpojo:openpojo:0.8.12'
    testImplementation 'org.mockito:mockito-core:2.22.0'
    testImplementation 'org.powermock:powermock-module-junit4:2.0.2'
    testImplementation 'org.powermock:powermock-api-mockito2:2.0.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.11.0'
    testImplementation 'androidx.arch.core:core-testing:2.0.1'
    testImplementation "org.robolectric:robolectric:4.3-alpha-2"

//    testImplementation 'org.dimensinfin:CoreBase.core:3.0.1'
//    testImplementation 'org.dimensinfin:ESI.SwaggerApi:4.0.1'
//    testImplementation project(':NeoCom.DataManagement')
}
