apply plugin: 'java-library'
apply plugin: 'project-report'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation group: 'io.swagger', name: 'swagger-annotations', version:'1.5.12'
    implementation group: 'org.glassfish.jersey.core', name: 'jersey-client', version:'2.25.1'
    implementation group: 'org.glassfish.jersey.media', name: 'jersey-media-multipart', version:'2.25.1'
    implementation ('org.glassfish.jersey.media:jersey-media-json-jackson:2.25.1'){
//        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
//        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
//        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
    }
    implementation ('org.glassfish.jersey.security:oauth2-client:2.25.1'){
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
    }
    implementation group: 'com.brsanthu', name: 'migbase64', version:'2.2'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version:'3.5'
    implementation group: 'org.hamcrest', name: 'hamcrest-all', version:'1.3'
}

sourceCompatibility = "1.7"
targetCompatibility = "1.7"
