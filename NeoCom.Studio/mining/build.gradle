apply plugin: 'com.android.dynamic-feature'

android {
    compileSdkVersion 28
    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 1
        versionName "0.15.0"
    }
}

// - A N D R O I D    S U P P O R T
dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment:1.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

// - P R O J E C T    D E P E N D E N C I E S
dependencies {
    // C O R E
    implementation 'org.slf4j:slf4j-android:1.7.12'
    implementation "joda-time:joda-time:$jodaTimeVersion"
}

dependencies {
    implementation project (':app')

    implementation project (':ESI.SwaggerApi')
    implementation project (':NeoCom.Model')
    implementation project (':NeoCom.DataManagement')
    implementation project (':AndroidMVCLibrary')
}
