apply plugin: 'com.android.library'

android {
    compileSdkVersion 26



    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 26
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/java-core'
        main.res.srcDirs += 'src/main/res-panels'
        main.res.srcDirs += 'src/main/res-separator'
        main {
            java {
                exclude 'org.dimensinfin.android.mvc.core.PartFactory.java'
            }
        }
    }
}

dependencies {
    // A N D R O I D   S U P P O R T
    implementation 'com.android.support:appcompat-v7:26.1.0'

    // A P P L I C A T I O N   M O D U L E S

    // L I B R A R I E S   D E P E N D E N C I E S
    implementation 'joda-time:joda-time:2.9.9'
//    implementation 'com.fasterxml.jackson.core:jackson-core:2.8.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.8.6'
//    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.8.6'
//    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.8.6'
        implementation ('com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.8.6'){
//        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
//        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
    }

    // T E S T I N G
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
}
