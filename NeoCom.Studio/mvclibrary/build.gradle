apply plugin: 'com.android.library'
apply plugin: 'project-report'

android {
    compileSdkVersion 26

    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 26
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/java-core'
        main.res.srcDirs += 'src/main/res-panels'
        main.res.srcDirs += 'src/main/res-separator'
    }
}

buildscript {
    repositories {
        mavenCentral()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.0.0'
    }
}

dependencies {
    // A N D R O I D   S U P P O R T
    implementation 'com.android.support:appcompat-v7:26.1.0'

    // A P P L I C A T I O N   M O D U L E S

    // L I B R A R I E S   D E P E N D E N C I E S
    implementation 'joda-time:joda-time:2.9.9'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.8.6'
}
