apply plugin: 'com.android.library'

android {
    compileSdkVersion 26



    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 26
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main.res.srcDirs += 'src/main/res-panels'
        main.res.srcDirs += 'src/main/res-separator'
        main {
            java {
                exclude 'org.dimensinfin.android.mvc.core.PartFactory.java'
            }
        }
    }
}

dependencies {
    // A P P L I C A T I O N   M O D U L E S
    //    implementation project(path: ':CoreBase.core-1.5.1')
    implementation 'joda-time:joda-time:2.9.9'
    //    implementation files('libs/CoreBase.core-1.5.1.jar')
    // L I B R A R I E S   D E P E N D E N C I E S
    implementation 'com.android.support:appcompat-v7:26.1.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
    implementation files('libs/CoreBase.core-1.5.1.jar')
}
