// - A N D R O I D    S U P P O R T
dependencies {
    implementation 'androidx.fragment:fragment:1.1.0'
    implementation 'androidx.core:core:1.1.0'
}
// - K O T L I N
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
// - P R O J E C T
dependencies {
    // C O R E
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.slf4j:slf4j-android:$loggerVersion"
    implementation "joda-time:joda-time:$jodaTimeVersion"
    implementation 'org.apache.commons:commons-lang3:3.9'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.annimon:stream:1.1.9'
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"

    // L I B R A R I E S
    implementation 'org.dimensinfin:CoreBase.core:3.2.0'
    implementation 'org.dimensinfin:ESI.SwaggerApi:4.16.0'
    implementation "org.dimensinfin:AndroidMVC:5.1.0@aar"
    implementation 'me.relex:circleindicator:2.1.0'
    implementation project(':app.Features')
//    implementation project(':NeoCom.DataManagement')
    implementation "org.dimensinfin:NeoCom.DataManagement:$neocomDatamanagementVersion"
}

// - L I B R A R Y   D E P E N D E N C I E S
dependencies {
//    // N E O C O M . D A T A M A N A G E M E N T
    implementation 'org.modelmapper:modelmapper:1.1.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    // D A T A B A S E
    implementation "com.j256.ormlite:ormlite-android:$ormliteVersion"
}
