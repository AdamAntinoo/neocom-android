// - A N D R O I D    S U P P O R T
dependencies {
    implementation 'androidx.fragment:fragment:1.1.0'
    implementation 'androidx.core:core:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
}
// - K O T L I N
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
// - P R O J E C T
dependencies {
    // C O R E
    implementation "org.slf4j:slf4j-android:$loggerVersion"
    implementation "joda-time:joda-time:$jodaTimeVersion"
    implementation 'org.apache.commons:commons-lang3:3.9'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.annimon:stream:1.1.9'
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"

    // L I B R A R I E S
    implementation "org.dimensinfin:CoreBase.core:$neocomCoreBaseVersion"
    implementation "org.dimensinfin:ESI.SwaggerApi:$neocomESISwaggerVersion"
    implementation "org.dimensinfin:AndroidMVC:5.1.0@aar"
    implementation 'me.relex:circleindicator:2.1.0'
    implementation project(':app.Features')
//    implementation project(':app.Annotations')
//    implementation project(':NeoCom.DataManagement')
    implementation "org.dimensinfin:NeoCom.DataManagement:$neocomDatamanagementVersion"
    implementation "org.dimensinfin:NeoCom.Annotations:$neocomDatamanagementVersion"
}

// - L I B R A R Y   D E P E N D E N C I E S
dependencies {
//    // N E O C O M . D A T A M A N A G E M E N T
    implementation 'org.modelmapper:modelmapper:1.1.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    // D A T A B A S E
    implementation "com.j256.ormlite:ormlite-android:$ormliteVersion"
}

// - U N I T   T E S T I N G
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.4.2'
//    testImplementation 'org.slf4j:slf4j-simple:1.7.26'
    testImplementation "joda-time:joda-time:$jodaTimeVersion"
    testImplementation 'com.openpojo:openpojo:0.8.12'
    testImplementation 'org.apache.commons:commons-lang3:3.9'
    testImplementation 'org.mockito:mockito-core:2.23.4'
}

// - I N S T R U M E N T A T I O N   T E S T S
dependencies {
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestUtil 'androidx.test:orchestrator:1.2.0'
    androidTestImplementation 'org.mockito:mockito-android:2.23.4'
}
