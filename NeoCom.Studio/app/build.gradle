apply plugin: 'com.android.application'
//apply plugin: 'kotlin-android'
apply plugin: 'project-report'

android {
    compileSdkVersion 27
    buildToolsVersion "26.0.2"
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        minSdkVersion 16
        targetSdkVersion 27
        multiDexEnabled true
        versionCode 111
        versionName "0.12.0"
        project.archivesBaseName = "NeoCom.Android"
        project.version = android.defaultConfig.versionName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            useProguard false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "appname", "NeoCom"
            resValue "string", "appversionnumber", android.defaultConfig.versionName
            resValue "string", "appversionname", "v" + android.defaultConfig.versionName
            resValue "string", "appversioncode", "\"" + android.defaultConfig.versionCode + "\""
            resValue "string", "appnameversion", "NeoCom v" + android.defaultConfig.versionName

            resValue "string", "appdatabasefilename", "neocomv0.12.0.db"
            resValue "string", "appdatabaseversion", "\"" + android.defaultConfig.versionCode + "\""
        }
        release {
            debuggable false
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "appdatabasefilename", "neocom.db"
        }
    }
//    signingConfigs {
//        release {
//            storeFile file("my-release-key.jks")
//            storePassword "password"
//            keyAlias "my-alias"
//            keyPassword "password"
//        }
//    }
    sourceSets {
        main.java{
            srcDirs += 'src/main/java-industry'
        }
//        main.java.srcDirs += 'src/main/java-newrelease'
//        main.java.srcDirs += 'src/main/java-eveesiandroid'
//        main.res.srcDirs += 'src/main/res-planetary'
//        main.res.srcDirs += 'src/main/res-definitions'
//        main.res.srcDirs += 'src/main/res-final'
        main.res {
            srcDirs += 'src/main/res-industry'
            srcDirs += 'src/main/res-layouts'
            srcDirs += 'src/main/res-sde'
            srcDirs += 'src/main/res-ui'
        }
//        main.res.srcDirs += 'src/main/res-newrelease'
//        main.res.srcDirs += 'src/main/res-obsolete'
//        main.res.srcDirs += 'src/main/res-production'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
        quiet true
    }
    dexOptions {
        javaMaxHeapSize "4G"
        jumboMode true
        preDexLibraries true
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
}

//--- T A S K S   C O M P L E M E N T A R Y
// Clean up the resources received from other modules.
// Needs to be executed manually because it is dangerous to leave this decision to the build.
//task cleanUpResources(type: Delete) {
//    delete 'src/main/resources/sdecontents'
//    delete 'src/main/resources/yaml'
//}
// Copy configuration and property resources from other modules to the final 'resources' application folder.
task copyResources(type: Copy) {
    copy {
        // NeoCom.Model Properties
        println 'Copy :NeoCom.Model resources to :NeoCom:MicroServices'
        from project(':NeoCom.Model').file('src/main/resources')
        into file('src/main/assets')
    }
    copy {
        println 'Copy :NeoCom.DataManagement resources to :NeoCom:MicroServices'
        from project(':NeoCom.DataManagement').file('src/main/resources')
        into file('src/main/assets')
    }
}
//--- D E P E N D E N C Y   V E R S I O N S
ext.supportLibraryVersion = '27.1.0'
ext.jodaTimeVersion = '2.3'
ext.fasterxmlJackson = '2.8.6'

//--- D E P E N D E N C I E S
dependencies {
    // A N D R O I D    S U P P O R T
    implementation "com.android.support:appcompat-v7:$supportLibraryVersion"
    implementation "com.android.support:support-core-ui:$supportLibraryVersion"
    implementation "com.android.support:support-core-utils:$supportLibraryVersion"
    implementation "com.android.support:support-v4:$supportLibraryVersion"
    implementation "com.android.support:support-v13:$supportLibraryVersion"
//    implementation 'com.android.support:support-annotations:$supportLibraryVersion'
//    implementation 'com.android.support:recyclerview-v7:$supportLibraryVersion'

    // P R O J E C T    D E P E N D E N C I E S
