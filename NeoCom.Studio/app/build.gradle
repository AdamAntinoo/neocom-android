apply plugin: 'com.android.application'

sourceCompatibility = "1.7"
targetCompatibility = "1.7"

android {
    compileSdkVersion 27
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        minSdkVersion 22
        targetSdkVersion 27
        versionCode 100
        versionName "0.10.1"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main.java.srcDirs += 'src/main/java-newrelease'
        main.res.srcDirs += 'src/main/res-definitions'
        main.res.srcDirs += 'src/main/res-final'
        main.res.srcDirs += 'src/main/res-layouts'
        main.res.srcDirs += 'src/main/res-newrelease'
    }
}

dependencies {
    // A N D R O I D   S U P P O R T
    implementation 'com.android.support:support-v4:27.0.0'
    implementation 'com.android.support:appcompat-v7:27.0.0'
    implementation 'com.android.support:support-v13:27.0.0'

    // A P P L I C A T I O N   M O D U L E S
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.8.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.8.3'
    implementation 'com.jakewharton:disklrucache:2.0.2'
    implementation 'com.j256.ormlite:ormlite-android:4.48'
    implementation 'joda-time:joda-time:2.3'
    implementation 'com.beimin:eveapi:6.0.6'

    // L O C A L   L I B R A R I E S
    implementation files('libs/jeveassets.3.1.2.jar')
    implementation files('libs/viewpagerindicator-release.aar')
    implementation project(path: ':AndroidMVCLibrary')
    implementation project(path: ':NeoCom.Model')
    implementation project(path: ':CoreBaseLibrary')

    // T E S T I N G
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
}
