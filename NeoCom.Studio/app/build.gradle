    implementation 'com.android.support:support-core-utils:27.0.2'

    // A P P L I C A T I O N    D E P E N D E N C I E S
    // N E O C O M
    implementation 'joda-time:joda-time:2.3'
    implementation 'com.beimin:eveapi:6.0.6'
    implementation 'com.jakewharton:disklrucache:2.0.2'
    implementation 'com.j256.ormlite:ormlite-android:4.48'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.8.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.8.6'
    implementation 'org.htmlparser:htmlparser:2.1'
    implementation 'org.slf4j:slf4j-api:1.7.25'
//    implementation 'org.slf4j:slf4j-android:1.7.25'
    implementation 'com.github.tony19:logback-android-classic:1.1.1-6'

    // A P P L I C A T I O N    D E P E N D E N C I E S
    implementation 'com.jakewharton:butterknife:7.0.1'
    annotationProcessor 'com.jakewharton:butterknife:7.0.1'
//    implementation 'io.reactivex:rxandroid:1.0.1'
//    implementation 'com.google.code.findbugs:jsr305:2.0.1'
//    implementation('com.google.oauth-client:google-oauth-client:1.20.0') {
//        exclude group: 'xpp3', module: 'xpp3'
//        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
//        exclude group: 'junit', module: 'junit'
//        exclude group: 'com.google.android', module: 'android'
//        exclude group: 'com.google.oauth-client', module: 'google-oauth-client'
//    }
//    implementation('com.google.http-client:google-http-client-jackson2:1.20.0') {
//        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
//    }
//    implementation 'commons-lang:commons-lang:2.6'

    // L O C A L    L I B R A R I E S
    implementation files('libs/jeveassets.3.1.2.jar')
    compileOnly files('libs/viewpagerindicator-release.aar')
    implementation project(path: ':AndroidMVCLibrary')
    implementation project(path: ':NeoCom.Model')
    implementation project(path: ':CoreBaseLibrary')

    // T E S T I N G
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
}
