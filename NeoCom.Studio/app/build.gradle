// - P L U G I N S
plugins {
    id "org.sonarqube" version "2.8"
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'project-report'
apply plugin: 'maven-publish'
apply from: './dependencies.gradle'
//apply from: './acceptance.gradle'
android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        testApplicationId "org.dimensinfin.eveonline.neocom.instrumentation"
        minSdkVersion 21 // Required because the colony drawing.
        targetSdkVersion 28
        multiDexEnabled true
        versionCode 121
        versionName "0.18.0"
        project.archivesBaseName = "NeoCom.Android"
        project.version = android.defaultConfig.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            signingConfig debug.signingConfig
            debuggable false
            shrinkResources true
            minifyEnabled true
            useProguard true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "appname", "NeoCom"
            resValue "string", "appnameversion", "NeoCom v" + android.defaultConfig.versionName
            resValue "string", "appversion", android.defaultConfig.versionName

            resValue "string", "appdatabasefilename", "neocom"
            resValue "string", "sdedatabasefilename", "sde.db"
            resValue "string", "appdatabaseversion", "\"" + android.defaultConfig.versionCode + "\""

            resValue "string", "DATASOURCE_PREFERENCE", "prefkey_dataSourceList"

            buildConfigField "Integer", "SDE_DB_VERSION", SDE_DB_VERSION
            buildConfigField "Integer", "NEOCOM_DB_VERSION", NEOCOM_DB_VERSION
        }
        debug {
            initWith release
            debuggable true
            shrinkResources false
            minifyEnabled false
            useProguard false
            testCoverageEnabled true
        }
    }
    sourceSets {
        main.java {
            srcDirs += 'src/main/java-adapters'
            srcDirs += 'src/main/java-assets'
//            srcDirs += 'src/main/java-mining'
//            srcDirs += 'src/main/java-planetary'
            srcDirs += 'src/main/java-datamanagement'
        }
        debug.java {
//            srcDirs += 'src/debug/java'
        }
        release.java {
        }
        main.res {
            srcDirs += 'src/main/res-fitting'
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    lintOptions {
        abortOnError false
        quiet true
    }
    dexOptions {
        javaMaxHeapSize "4G"
        jumboMode true
        preDexLibraries true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${android.defaultConfig.project.archivesBaseName}-${android.defaultConfig.versionName}.apk"
        }
    }
}

// - T A S K S   C O M P L E M E N T A R Y
ext {
    assetsPath = "$projectDir/src/main/assets"
}
