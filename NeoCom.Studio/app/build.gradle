apply plugin: 'com.android.application'
apply plugin: 'project-report'

//sourceCompatibility = "1.7"
//targetCompatibility = "1.7"
//
buildscript {
    repositories {
        mavenCentral()
        jcenter()
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.0.0'
        classpath 'me.tatarka:gradle-retrolambda:3.2.3'
        classpath 'com.neenbedankt.gradle.plugins:android-apt:1.4'
    }
}

android {
    compileSdkVersion 27
    buildToolsVersion "26.0.2"
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        minSdkVersion 22
        targetSdkVersion 27
        multiDexEnabled true
        versionCode 100
        versionName "0.10.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            minifyEnabled false
            useProguard false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main.java.srcDirs += 'src/main/java-newrelease'
        main.res.srcDirs += 'src/main/res-definitions'
        main.res.srcDirs += 'src/main/res-final'
        main.res.srcDirs += 'src/main/res-layouts'
        main.res.srcDirs += 'src/main/res-newrelease'
    }
    lintOptions {
        abortOnError false
        quiet true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

dependencies {
    // A N D R O I D    S U P P O R T
    implementation 'com.android.support:support-v4:27.0.1'
    implementation 'com.android.support:appcompat-v7:27.0.1'
    implementation 'com.android.support:support-v13:27.0.1'
    implementation 'com.android.support:design:27.0.1'

    // A P P L I C A T I O N    D E P E N D E N C I E S
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.8.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.8.6'
    implementation 'com.jakewharton:disklrucache:2.0.2'
    implementation 'com.j256.ormlite:ormlite-android:4.48'
    implementation 'joda-time:joda-time:2.3'
    implementation 'com.beimin:eveapi:6.0.6'
    compileOnly 'com.jakewharton:butterknife:7.0.1'
    annotationProcessor 'com.jakewharton:butterknife:7.0.1'
    implementation 'io.reactivex:rxandroid:1.0.1'
    implementation 'com.google.code.findbugs:jsr305:2.0.1'
    implementation('com.google.oauth-client:google-oauth-client:1.20.0') {
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        exclude group: 'junit', module: 'junit'
        exclude group: 'com.google.android', module: 'android'
        exclude group: 'com.google.oauth-client', module: 'google-oauth-client'
    }
    implementation('com.google.http-client:google-http-client-jackson2:1.20.0') {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
    }
    implementation 'commons-lang:commons-lang:2.6'

    // L O C A L    L I B R A R I E S
    implementation files('libs/jeveassets.3.1.2.jar')
    compileOnly files('libs/viewpagerindicator-release.aar')
    implementation project(path: ':AndroidMVCLibrary')
    implementation project(path: ':NeoCom.Model')
    implementation project(path: ':CoreBaseLibrary')

    // T E S T I N G
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
}
