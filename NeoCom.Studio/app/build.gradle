apply plugin: 'com.android.application'
apply plugin: 'project-report'

buildscript {
    repositories {
        mavenCentral()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.0.0'
        classpath 'me.tatarka:gradle-retrolambda:3.2.3'
        classpath 'com.neenbedankt.gradle.plugins:android-apt:1.4'
    }
}

android {
    compileSdkVersion 26
    buildToolsVersion "26.0.2"

    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        minSdkVersion 26
        targetSdkVersion 26
        multiDexEnabled true
        versionCode 101
        versionName "0.10.1"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            minifyEnabled false
//            useProguard false
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
//        main.java.srcDirs += 'src/main/java-eve-esi'
//        main.java.srcDirs += 'src/test/java-eve-esi'
    }

    lintOptions {
        abortOnError false
        quiet true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // A N D R O I D   S U P P O R T
    implementation 'com.android.support:design:26.1.0'

    // A P P L I C A T I O N   M O D U L E S
    implementation project(path: ':mvclibrary')
    implementation ('net.troja.eve:eve-esi:1.0.0') {
//        exclude group: 'javax.inject', module: 'javax.inject'
        exclude group: 'org.glassfish.hk2.external', module: 'javax.inject'
    }

    // L I B R A R I E S   E V E
//    implementation 'joda-time:joda-time:2.9.9'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.8.6'

    // D E P E N D E N C I E S   R E M O V E D
//    implementation 'javax.inject:javax.inject:1'

    // L I B R A R I E S   D E P E N D E N C I E S
    implementation 'com.jakewharton:butterknife:7.0.1'
    annotationProcessor 'com.jakewharton:butterknife:7.0.1'
    implementation 'io.reactivex:rxandroid:1.0.1'
    implementation('com.google.oauth-client:google-oauth-client:1.20.0') {
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        exclude group: 'junit', module: 'junit'
        exclude group: 'com.google.android', module: 'android'
    }
    implementation('com.google.http-client:google-http-client-jackson2:1.20.0') {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
    }
    implementation 'commons-lang:commons-lang:2.6'

    // T E S T I N G
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1+'
}
