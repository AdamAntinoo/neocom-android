apply plugin: 'com.android.application'
//apply plugin: 'kotlin-android'
apply plugin: 'project-report'

android {
    compileSdkVersion 27
    buildToolsVersion "26.0.2"
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        minSdkVersion 16
        targetSdkVersion 27
        multiDexEnabled true
        versionCode 109
        versionName "0.12.0"
        project.archivesBaseName = "NeoCom.Android"
        project.version = android.defaultConfig.versionName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            useProguard false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "appname", "NeoCom"
            resValue "string", "appversionnumber", android.defaultConfig.versionName
            resValue "string", "appversionname", "v" + android.defaultConfig.versionName
            resValue "string", "appversioncode", "\"" + android.defaultConfig.versionCode + "\""
            resValue "string", "appnameversion", "\"" + android.defaultConfig.versionCode + "\""

            resValue "string", "appdatabasefilename", "neocom" + android.defaultConfig.versionCode + ".db"
            resValue "string", "appdatabaseversion", "\"" + android.defaultConfig.versionCode + "\""

            resValue "string", "cachefoldername", "neocomcache"
            resValue "string", "drawablecachefoldername", "drawablecache"
        }
        release {
            debuggable false
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "appdatabasefilename", "neocom.db"
        }
    }
//    signingConfigs {
//        release {
//            storeFile file("my-release-key.jks")
//            storePassword "password"
//            keyAlias "my-alias"
//            keyPassword "password"
//        }
//    }
    sourceSets {
//        main.java.srcDirs += 'src/main/java-planetary'
//        main.java.srcDirs += 'src/main/java-newrelease'
//        main.java.srcDirs += 'src/main/java-eveesiandroid'
//        main.res.srcDirs += 'src/main/res-planetary'
//        main.res.srcDirs += 'src/main/res-definitions'
//        main.res.srcDirs += 'src/main/res-final'
        main.res {
            srcDirs += 'src/main/res-layouts'
            srcDirs += 'src/main/res-window'
        }
//        main.res.srcDirs += 'src/main/res-newrelease'
//        main.res.srcDirs += 'src/main/res-obsolete'
//        main.res.srcDirs += 'src/main/res-production'
//        main.res.srcDirs += 'src/main/res-ui'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
        quiet true
    }
    dexOptions {
        javaMaxHeapSize "4G"
        jumboMode true
        preDexLibraries true
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
}

//--- T A S K S
// Clean up the resources received from other modules.
// Needs to be executed manually because it is dangerous to leave this decision to the build.
task cleanUpResources(type: Delete) {
    delete 'src/main/resources/sdecontents'
    delete 'src/main/resources/yaml'
}
