// - P L U G I N S
plugins {
    id "org.sonarqube" version "2.7"
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'project-report'
apply plugin: 'maven-publish'

android {
//    signingConfigs {
//        release {
//            storeFile file('signing-store')
//            storePassword '01.passwd.store'
//            keyAlias = 'alias'
//            keyPassword 'password'
//        }
//        debug {
//            storeFile file('debug-store')
//            storePassword '01.password'
//            keyAlias = 'alias'
//            keyPassword 'password'
//        }
//    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    compileSdkVersion 28
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        minSdkVersion 21 // Required because the colony drawing.
        targetSdkVersion 28
        multiDexEnabled true
        versionCode 118
        versionName "0.15.1"
        project.archivesBaseName = "NeoCom.Android"
        project.version = android.defaultConfig.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            signingConfig debug.signingConfig
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "appname", "NeoCom"
            resValue "string", "appversionnumber", android.defaultConfig.versionName
            resValue "string", "appversionname", "v" + android.defaultConfig.versionName
            resValue "string", "appversioncode", "\"" + android.defaultConfig.versionCode + "\""
            resValue "string", "appnameversion", "NeoCom v" + android.defaultConfig.versionName

            resValue "string", "appdatabasefilename", "neocom"
            resValue "string", "appdatabaseversion", "\"" + android.defaultConfig.versionCode + "\""

            resValue "string", "DATASOURCE_PREFERENCE", "prefkey_dataSourceList"
        }
        debug {
            initWith release
            debuggable true
            minifyEnabled false
            useProguard false
            resValue "string", "appdatabasefilename", "neocomv0.14.0"
        }
    }
    sourceSets {
        main.java {
            srcDirs += 'src/main/java-appv3'
            srcDirs += 'src/main/java-appv4'
            srcDirs += 'src/main/java-app'
            srcDirs += 'src/main/java-industry'
            srcDirs += 'src/main/java-mining'
            srcDirs += 'src/main/java-planetary'
            srcDirs += 'src/main/java-shared'
        }
        debug.java {
            srcDirs += 'src/debug/java-app'
            srcDirs += 'src/debug/java-test'
//            srcDirs += 'src/debug/java-mining'
        }
        release.java {
            srcDirs += 'src/release/java-app'
        }
        main.res {
            srcDirs += 'src/main/res-app'
            srcDirs += 'src/main/res-core'
            srcDirs += 'src/main/res-fitting'
            srcDirs += 'src/main/res-industry'
            srcDirs += 'src/main/res-layouts'
            srcDirs += 'src/main/res-mining'
            srcDirs += 'src/main/res-planetary'
            srcDirs += 'src/main/res-sde'
            srcDirs += 'src/main/res-ui'
        }
        debug.res{
            srcDirs += 'src/main/res-planetary'
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${android.defaultConfig.project.archivesBaseName}-${android.defaultConfig.versionName}.apk"
        }
    }
    //    signingConfigs {
//        release {
//            storeFile file("my-release-key.jks")
//            storePassword "password"
//            keyAlias "my-alias"
//            keyPassword "password"
//        }
//    }
    lintOptions {
        abortOnError false
        quiet true
    }
    dexOptions {
        javaMaxHeapSize "4G"
        jumboMode true
        preDexLibraries true
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
//    dynamicFeatures = [":mining"]
}

//--- T A S K S   C O M P L E M E N T A R Y
// Copy configuration and property resources from other modules to the final 'resources' application folder.
task copyResources(type: Copy) {
    copy {
        println 'Copy :NeoCom.DataManagement resources to :NeoCom:MicroServices'
        from project(':NeoCom.DataManagement').file('src/main/resources')
        into file('src/main/assets')
    }
}

// - P R O D U C T   V E R S I O N S
ext {
    supportLibraryVersion = '28.0.0'
    jodaTimeVersion = '2.3'
    jacksonVersion = '2.9.4'
    fasterxmlJackson = '2.9.4'
    ormliteVersion = '4.48'
    retrofitVersion = '2.3.0'
    powermockVersion = '2.0.2'
}

// - A N D R O I D    S U P P O R T
dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment:1.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

// - D E B U G   S T H E T O
dependencies {
    implementation 'com.facebook.stetho:stetho:1.5.1'
    implementation 'com.facebook.stetho:stetho-okhttp3:1.5.1'
}

