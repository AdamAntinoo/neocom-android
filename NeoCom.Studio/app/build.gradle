// - P L U G I N S
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'project-report'
apply plugin: 'maven-publish'
apply from: './dependencies.gradle'
apply from: './acceptance.gradle'

android {
    compileSdkVersion 29
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        minSdkVersion 21 // Required because the colony drawing.
        targetSdkVersion 29
        multiDexEnabled true
        versionCode 119
        versionName "0.16.0"
        project.archivesBaseName = "NeoCom.Android"
        project.version = android.defaultConfig.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            signingConfig debug.signingConfig
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "appname", "NeoCom"
            resValue "string", "appversionnumber", android.defaultConfig.versionName
            resValue "string", "appversionname", "v" + android.defaultConfig.versionName
//            resValue "string", "appversioncode", "\"" + android.defaultConfig.versionCode + "\""
//            resValue "string", "appnameversion", "NeoCom v" + android.defaultConfig.versionName

            resValue "string", "appdatabasefilename", "neocom"
            resValue "string", "sdedatabasefilename", "sde.db"
            resValue "string", "appdatabaseversion", "\"" + android.defaultConfig.versionCode + "\""

            resValue "string", "DATASOURCE_PREFERENCE", "prefkey_dataSourceList"

            buildConfigField "String", "SDE_DB_VERSION", SDE_DB_VERSION
        }
        debug {
            initWith release
            debuggable true
            minifyEnabled false
            useProguard false
            testCoverageEnabled true
            resValue "string", "appdatabasefilename", "neocomv0.15"
            buildConfigField "String", "TEST_TAGS", "\"" + "@SplashActivity" + "\""
            buildConfigField "String", "TEST_SCENARIO", "\"" + "@MVCPanel" + "\""
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    lintOptions {
        abortOnError false
        quiet true
    }
    dexOptions {
        javaMaxHeapSize "4G"
        jumboMode true
        preDexLibraries true
    }
    sourceSets {
        main.java {
            srcDirs += 'src/main/java-appv3'
            srcDirs += 'src/main/java-appv4'
            srcDirs += 'src/main/java-app'
            srcDirs += 'src/main/java-industry'
            srcDirs += 'src/main/java-mining'
            srcDirs += 'src/main/java-planetary'
        }
        debug.java {
            srcDirs += 'src/debug/java-app'
            srcDirs += 'src/debug/java-test'
        }
        release.java {
            srcDirs += 'src/release/java-app'
        }
        main.res {
            srcDirs += 'src/main/res-fitting'
        }
        debug.res {
            srcDirs += 'src/main/res-planetary'
        }
        test.java {
            srcDir project(':NeoCom.DataManagement').file("src/test/java-support")
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${android.defaultConfig.project.archivesBaseName}-${android.defaultConfig.versionName}.apk"
        }
    }
//    packagingOptions {
//        exclude 'META-INF/DEPENDENCIES'
//        exclude 'META-INF/LICENSE'
//        exclude 'META-INF/LICENSE.txt'
//        exclude 'META-INF/license.txt'
//        exclude 'META-INF/NOTICE'
//        exclude 'META-INF/NOTICE.txt'
//        exclude 'META-INF/notice.txt'
//        exclude 'META-INF/ASL2.0'
//    }
}

// - T A S K S   C O M P L E M E N T A R Y
// Copy configuration and property resources from other modules to the final 'resources' application folder.
task copyResources(type: Copy) {
    copy {
        println 'Copy :NeoCom.DataManagement resources to :NeoCom:MicroServices'
        from project(':NeoCom.DataManagement').file('src/main/resources')
        into file('src/main/assets')
    }
}
build.dependsOn copyResources

// Create the sde setup version data with the configured version contents.
task generateVersionSQL() {
    doLast {
        new File("./src/main/sh/setVersion.sql").text = "INSERT INTO `version` VALUES (${SDE_DB_VERSION});"
    }
}
// Generate the SDE database if does not exist or the version does not match
task generateSDEDatabase(type: Exec) {
    println 'Generate the Version data...'
    workingDir './src/main/sh'
    commandLine './create-sde.sh'
}
task copySDEDatabase(type: Copy) {
    println 'Copy SDE database to Assets...'
    from './src/main/sh/sde.db'
    into './src/main/assets'
}
generateSDEDatabase.dependsOn generateVersionSQL
copySDEDatabase.dependsOn generateSDEDatabase
build.dependsOn copySDEDatabase
