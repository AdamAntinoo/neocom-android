apply plugin: 'com.android.application'
//apply plugin: 'kotlin-android'
apply plugin: 'project-report'

android {
    compileSdkVersion 27
    buildToolsVersion "26.0.2"
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        minSdkVersion 22
        targetSdkVersion 27
        multiDexEnabled true
        versionCode 100
        versionName "0.10.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            minifyEnabled false
            useProguard false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main.java.srcDirs += 'src/main/java-newrelease'
        main.java.srcDirs += 'src/main/java-eveesiandroid'
        main.res.srcDirs += 'src/main/res-definitions'
        main.res.srcDirs += 'src/main/res-final'
        main.res.srcDirs += 'src/main/res-layouts'
        main.res.srcDirs += 'src/main/res-newrelease'
        main.res.srcDirs += 'src/main/res-obsolete'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
        quiet true
    }
}

dependencies {
    // A N D R O I D    S U P P O R T
//    implementation 'com.android.support:support-v4:27.0.1'
//    implementation 'com.android.support:appcompat-v7:27.0.1'
