// - A C C E P T A N C E
android {
    sourceSets {
        androidTest.java {
            srcDirs += 'src/androidTest-acceptance/java'
        }
        androidTest.resources {
            srcDirs += 'src/androidTest-acceptance/resources'
        }
    }
}
ext {
    cucumberVersion = '3.0.1'
}
// - C U C U M B E R
dependencies {
    androidTestImplementation "io.cucumber:cucumber-java:$cucumberVersion"
    androidTestImplementation "io.cucumber:cucumber-junit:$cucumberVersion"
    androidTestImplementation "io.cucumber:cucumber-picocontainer:$cucumberVersion"
}
