// - A C C E P T A N C E
def getInstrumentation() {
    project.hasProperty('cucumber') ?
            'org.dimensinfin.eveonline.neocom.app.support.CucumberTestRunner' :
            'androidx.test.runner.AndroidJUnitRunner'
}
android {
    sourceSets {
        androidTest.java {
            srcDirs += 'src/androidTest-acceptance/java'
        }
        androidTest.resources {
            srcDirs += 'src/androidTest-acceptance/resources'
        }
    }
    defaultConfig {
        testInstrumentationRunner getInstrumentation()
    }
    buildTypes {
        debug {
            buildConfigField "String", "TEST_TAGS", "@SplashActivity"
            buildConfigField "String", "TEST_SCENARIO", "@MVCPanel"
        }
    }
}
ext {
    cucumberVersion = '4.3.0'
}
// - C U C U M B E R
dependencies {
//    implementation "io.cucumber:cucumber-java:$cucumberVersion"
//    implementation "io.cucumber:cucumber-junit:$cucumberVersion"
//    implementation "io.cucumber:cucumber-picocontainer:$cucumberVersion"
//    testImplementation "io.cucumber:cucumber-java:$cucumberVersion"
//    testImplementation "io.cucumber:cucumber-junit:$cucumberVersion"
//    testImplementation "io.cucumber:cucumber-picocontainer:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-java:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-junit:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-android:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-picocontainer:$cucumberVersion"
}
dependencies {
    androidTestImplementation "io.cucumber:cucumber-jvm:$cucumberVersion"
    androidTestImplementation "io.cucumber:cucumber-java:$cucumberVersion"
    androidTestImplementation "io.cucumber:cucumber-junit:$cucumberVersion"
//    androidTestImplementation "io.cucumber:cucumber-core:$cucumberVersion"
// https://mvnrepository.com/artifact/io.cucumber/cucumber-android
    androidTestImplementation "io.cucumber:cucumber-android:$cucumberVersion"
    androidTestImplementation "io.cucumber:cucumber-picocontainer:$cucumberVersion"
}
