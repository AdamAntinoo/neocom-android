apply plugin: 'com.android.library'

android {
    compileSdkVersion 28
    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 1
        versionName "0.15.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
}

// - A N D R O I D    S U P P O R T
dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment:1.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

// - P R O J E C T    D E P E N D E N C I E S
dependencies {
    // C O R E
    implementation 'org.slf4j:slf4j-api:1.7.12'
    implementation "joda-time:joda-time:$jodaTimeVersion"
    implementation 'org.dimensinfin:CoreBase.core:3.0.1'
    // D A T A B A S E
    implementation "com.j256.ormlite:ormlite-android:$ormliteVersion"
}

dependencies {
    implementation project(':ESI.SwaggerApi')
    implementation project(':NeoCom.Model')
    implementation project(':NeoCom.DataManagement')
    implementation project(':AndroidMVCLibrary')
}

// - N E O C O M . M O D E L
dependencies{
    compileOnly 'org.dimensinfin:CoreBase.core:3.0.1'

    implementation 'com.beimin:eveapi:6.0.6'
    implementation "com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-joda:$jacksonVersion"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-json-org:$jacksonVersion"
    implementation 'org.modelmapper:modelmapper:1.1.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.3.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    implementation 'com.annimon:stream:1.1.9'
}
