// - P L U G I N S
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'project-report'
apply from: '../app/dependencies.gradle'

android {
    compileSdkVersion 28
    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:3.0.0'
    }
    defaultConfig {
        applicationId "org.dimensinfin.eveonline.neocom"
        testApplicationId "org.dimensinfin.eveonline.neocom.test"
        testInstrumentationRunner "org.dimensinfin.eveonline.neocom.test.NeoComAndroidJUnitRunner"
        minSdkVersion 21 // Required because the colony drawing.
        targetSdkVersion 28
        versionCode 30
        versionName "0.19.5"
        project.archivesBaseName = "NCAcceptanceTests-$versionName"
        project.version = android.defaultConfig.versionName
    }
    buildTypes {
        release {
            signingConfig debug.signingConfig
            debuggable false
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "DATASOURCE_PREFERENCE", "prefkey_dataSourceList"

            buildConfigField "Integer", "SDE_DB_VERSION", SDE_DB_VERSION
            buildConfigField "Integer", "NEOCOM_DB_VERSION", NEOCOM_DB_VERSION
        }
        debug {
            initWith(release)
            debuggable true
            shrinkResources false
            minifyEnabled false
            testCoverageEnabled true
        }
    }
    sourceSets {
        main.assets {
            srcDirs += project(':app').file('src/main/assets')
        }
        main.java {
            srcDirs += project(':app').file('src/main/java')
            srcDirs += project(':app').file('src/main/java-adapters')
            srcDirs += project(':app').file('src/main/java-assets')
            srcDirs += project(':app').file('src/main/java-mining')
        }
        debug.java {
            srcDirs += project(':app').file('src/debug/java')
        }
        main.res {
            srcDirs += project(':app').file('src/main/res-app')
            srcDirs += project(':app').file('src/main/res-icons')
            srcDirs += project(':app').file('src/main/res-core')
            srcDirs += project(':app').file('src/main/res-sde')
            srcDirs += project(':app').file('src/main/res-ui')
            srcDirs += project(':app').file('src/main/res-layouts')
            srcDirs += project(':app').file('src/main/res-assets')
            srcDirs += project(':app').file('src/main/res-fitting')
            srcDirs += project(':app').file('src/main/res-mining')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
        animationsDisabled true
    }

    packagingOptions {
        exclude 'LICENSE.txt'
    }
}
ext {
    cucumberJavaVersion = '4.3.1'
}

// - A N D R O I D
dependencies {
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.fragment:fragment:1.1.0'
    implementation 'me.relex:circleindicator:2.1.0'
    implementation 'org.slf4j:slf4j-android:1.7.26'
}
// - T E S T I N G
dependencies {
//    testImplementation 'junit:junit:4.12'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.5.2'
    testImplementation 'org.slf4j:slf4j-simple:1.7.26'
    testImplementation 'org.mockito:mockito-core:2.23.4'
    testImplementation 'org.awaitility:awaitility:3.1.6'
}
// - A N D R O I D   T E S T I N G
dependencies {
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestUtil 'androidx.test:orchestrator:1.2.0'

    androidTestImplementation 'org.mockito:mockito-android:2.23.4'
    androidTestImplementation 'org.awaitility:awaitility:3.1.6'

    // - C U C U M B E R
    androidTestImplementation "io.cucumber:cucumber-android:$cucumberJavaVersion"
    androidTestImplementation "io.cucumber:cucumber-picocontainer:$cucumberJavaVersion"

    // - C O R E
    androidTestImplementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    androidTestImplementation "joda-time:joda-time:$jodaTimeVersion"
    // - C A C H E
    androidTestImplementation "com.nytimes.android:store3:$cacheVersion" // Cache and store
    androidTestImplementation "com.nytimes.android:cache3:$cacheVersion"
    androidTestImplementation "com.nytimes.android:middleware3:$cacheVersion"
    androidTestImplementation "com.nytimes.android:filesystem3:$cacheVersion"
    androidTestImplementation 'io.reactivex.rxjava2:rxjava:2.2.12'
    androidTestImplementation 'com.jakewharton:disklrucache:2.0.2'
    // - P A R S E R
    androidTestImplementation "com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion"
    // - JSON converter
    androidTestImplementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    androidTestImplementation "com.fasterxml.jackson.datatype:jackson-datatype-joda:$jacksonVersion"
    androidTestImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion"
    androidTestImplementation "com.fasterxml.jackson.datatype:jackson-datatype-json-org:$jacksonVersion"
}
