//plugins {
//    id "com.github.samueltbrown.cucumber" version "0.9"
//}
apply plugin: 'com.android.library'
apply plugin: 'project-report'
apply from: 'cucumber.gradle'
apply from: 'tasks.gradle'

android {
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    compileSdkVersion 28
    defaultConfig {
        minSdkVersion 21 // Required because the colony drawing.
        targetSdkVersion 28
        versionCode 1
        versionName "0.15.0"
    }
    buildTypes {
        release {
            signingConfig debug.signingConfig
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            resValue "string", "appname", "NeoCom"
            resValue "string", "appversionnumber", android.defaultConfig.versionName
            resValue "string", "appversionname", "v" + android.defaultConfig.versionName
            resValue "string", "appversioncode", "\"" + android.defaultConfig.versionCode + "\""
            resValue "string", "appnameversion", "NeoCom v" + android.defaultConfig.versionName

            resValue "string", "appdatabasefilename", "neocom"
            resValue "string", "appdatabaseversion", "\"" + android.defaultConfig.versionCode + "\""

            resValue "string", "DATASOURCE_PREFERENCE", "prefkey_dataSourceList"
        }
        debug {
            initWith release
            debuggable true
            minifyEnabled false
            useProguard false
            resValue "string", "appdatabasefilename", "neocomv0.14.0"
        }
    }
    sourceSets {
        main.java {
            srcDirs += 'src/main-app/java-app'
            srcDirs += 'src/main-features/java-planetary'
            srcDirs += 'src/main-features/java-mining'
        }
        main.res {
            srcDirs += 'src/main-app/res-app'
            srcDirs += 'src/main-app/res-core'
            srcDirs += 'src/main-app/res-layouts'
            srcDirs += 'src/main-app/res-sde'
            srcDirs += 'src/main-app/res-ui'

            srcDirs += 'src/main-features/res-mining'
            srcDirs += 'src/main-features/res-planetary'
            srcDirs += 'src/main-features/res-industry'
        }
        test.java {
            srcDirs += project(':NeoCom.DataManagement').file("src/test/java-support")
            srcDirs += project(':NeoCom.DataManagement.AcceptanceTests').file("src/test/java-steps")
            srcDirs += project(':NeoCom.DataManagement.AcceptanceTests').file("src/test/java-support")
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    lintOptions {
        abortOnError false
        quiet true
    }
    dexOptions {
        javaMaxHeapSize "4G"
        jumboMode true
        preDexLibraries true
    }
}

// - A N D R O I D    S U P P O R T
dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment:1.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

// - P R O J E C T    D E P E N D E N C I E S
dependencies {
    // C O R E
    compileOnly 'org.slf4j:slf4j-api:1.7.12'
    compileOnly "joda-time:joda-time:$jodaTimeVersion"
    implementation 'org.apache.commons:commons-lang3:3.7'
    implementation 'com.annimon:stream:1.1.9'

    compileOnly 'org.dimensinfin:CoreBase.core:3.1.0'
    compileOnly 'org.dimensinfin:ESI.SwaggerApi:4.0.1'
    implementation project(':NeoCom.DataManagement')
    implementation "org.dimensinfin:AndroidMVC:5.0.0@aar"

    // N E O C O M
    implementation 'com.jakewharton:disklrucache:2.0.2'
    implementation 'com.squareup.picasso:picasso:2.71828'
}

// - T E S T I N G
dependencies {
    // N E O C O M
    testImplementation 'org.dimensinfin:CoreBase.core:3.0.1'
    testImplementation 'org.dimensinfin:ESI.SwaggerApi:4.0.1'

    testImplementation 'junit:junit:4.12'
//    compileOnly 'org.slf4j:slf4j-simple:1.7.26'
    testImplementation "joda-time:joda-time:$jodaTimeVersion"
    testImplementation 'com.openpojo:openpojo:0.8.12'
    testImplementation 'org.apache.commons:commons-lang3:3.7'
    testImplementation 'org.mockito:mockito-core:2.23.4'
    // D A T A B A S E
    testImplementation "com.j256.ormlite:ormlite-jdbc:$ormliteVersion"
    testImplementation 'org.xerial:sqlite-jdbc:3.25.2'
    testImplementation 'javax.persistence:javax.persistence-api:2.2'
}
